<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6b4328"><title>Barista Tasks · Kape’ Bar-Rio</title>
<link rel="stylesheet" href="page-tools.css"><link rel="stylesheet" href="sync.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3eb;color:#503827;font:15px system-ui,sans-serif}main{max-width:940px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(24px,4vw,34px)}.muted{color:#7f6b59;font-size:13px}.panel{background:white;border:1px solid #dbc8b5;border-radius:18px;padding:16px;margin-bottom:14px}
button,input,select{font:inherit}button{border:1px solid #c9ad95;border-radius:12px;background:white;color:#503827;min-height:42px;padding:9px 14px;cursor:pointer}button:disabled{opacity:.55}button.active,button.primary{background:#653f29;color:white;border-color:#653f29}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1}.summary{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}progress{width:100%;height:10px;accent-color:#3d794c}
.task{display:grid;grid-template-columns:76px minmax(0,1fr) 104px;gap:12px;align-items:center;border-top:1px solid #e9ddd3;padding:13px 0}.task:first-child{border-top:0}.time{font-size:12px;font-weight:700;text-align:right;overflow-wrap:anywhere}.late{color:#b32b25}.task-title{font-weight:700}.done{color:#22763f}.task-note{font-size:12px;color:#816e5b;margin-top:5px}.check{min-width:0;width:66px;padding:9px 6px;font-weight:750;background:#376747;color:white;border-color:#376747}.check.done{background:#e7efe5;color:#376747;border-color:#b8d4bc}.task.completed .task-title{text-decoration:line-through;opacity:.7}
.completed-group{background:#f0f5ed;border-color:#b8d4bc}.completed-group .task{opacity:.75}.shop-closed .check{opacity:.5}.task-group{margin-top:18px;border:1px solid #e8d9ca;border-radius:14px;padding:12px;background:#fffdf9}.group-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:8px;color:#503827}.group-heading strong{font-size:17px}.group-heading span{font-size:12px;font-weight:700;background:#f0e3d5;border-radius:15px;padding:4px 8px}.group-note{margin:0 0 10px}.owner-task{margin:8px 0;border:1px solid #e7d9cc;border-radius:11px;padding:10px}.owner-task summary{cursor:pointer;font-weight:650}.owner-task summary small{font-weight:400;color:#806e60}.owner-task .editor{margin-top:12px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{width:100%;border:1px solid #cbb5a1;border-radius:9px;padding:10px;min-height:42px}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#message{min-height:24px;color:#8f3b23}.editor{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}.editor .active-switch{display:flex;gap:6px;align-items:center}.editor button{justify-self:start}.editor label{font-size:12px;font-weight:700}.editor input,.editor select{display:block;width:100%;margin-top:4px;border:1px solid #cbb5a1;border-radius:9px;padding:9px;min-height:42px}
@media(max-width:600px){main{padding:12px}.task{grid-template-columns:62px minmax(0,1fr) 72px;gap:8px}.task .check{width:57px;padding:9px 2px}.time{font-size:10px}.editor{grid-template-columns:1fr 1fr}.editor label:first-child{grid-column:span 2}}
.worker-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px}.inline-worker-picker{background:white;border:1px solid #dbc8b5;border-radius:16px;padding:18px;margin:12px 0}.tabs button{display:flex;align-items:center;justify-content:center;gap:7px}.task .task-title{overflow-wrap:anywhere}

/* Evening shift: black panels with high-contrast white tasks */
body.evening-mode{background:#111111;color:#f7f7f7}
body.evening-mode .panel,body.evening-mode .task-group{background:#191919;border-color:#454545;color:#fff}
body.evening-mode .group-heading,body.evening-mode .task-title,body.evening-mode .time,body.evening-mode h1,body.evening-mode h2{color:#fff}
body.evening-mode .muted,body.evening-mode .task-note,body.evening-mode .group-note{color:#cacaca}
body.evening-mode .task{border-top-color:#414141}
body.evening-mode .group-heading span{background:#383838;color:#fff}
body.evening-mode .completed-group{background:#252525;border-color:#555}
body.evening-mode .check{background:#fff;color:#111;border-color:#fff}
body.evening-mode .check.done{background:#444;color:#fff;border-color:#777}
body.evening-mode .late{color:#ff9d9d}
body.evening-mode progress{accent-color:#fff}
body.evening-mode .tabs button{border-color:#666;background:#2c2c2c;color:#fff}
body.evening-mode .tabs button.active{background:#000;border-color:#fff;color:#fff}
body.evening-mode #refresh,body.evening-mode #addTask,body.evening-mode .owner-task button{background:#323232;color:white;border-color:#777}
body.evening-mode .owner-task,body.evening-mode .editor input,body.evening-mode .editor select{background:#262626;color:#fff;border-color:#555}
body.evening-mode .owner-task summary small{color:#ddd}
body.evening-mode #message{color:#ffd0c5}
body:not(.evening-mode) .tabs #evening{background:#111;color:#fff;border-color:#111}

#taskDialog{width:min(520px,calc(100% - 24px));max-height:90dvh;overflow:auto;border:1px solid #d4b99f;border-radius:20px;padding:22px;background:#fff;color:#503827;box-shadow:0 20px 80px #0005}
#taskDialog::backdrop{background:#17100bd0}#taskDialog form{display:grid;gap:14px}#taskDialog h2{margin:0;color:#503827}
#taskDialog label{display:grid;gap:5px;font-weight:650}#taskDialog input:not([type=checkbox]),#taskDialog select,#taskDialog textarea{min-height:43px;width:100%;padding:10px;border:1px solid #cbb5a1;border-radius:10px;font:inherit}
#taskDialog fieldset{display:flex;flex-wrap:wrap;gap:12px;border:1px solid #e4d4c4;border-radius:12px;padding:12px}#taskDialog legend{font-weight:700}#taskDialog .task-checkbox{display:flex;align-items:center;gap:7px}#taskDialog .task-checkbox input{width:18px;height:18px}
#taskDialog .time-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}#taskAddError{margin:0;color:#a32828;min-height:0}
body.evening-mode #addTask{background:#fff;color:#111;border-color:#eee}
.task-app-link{color:#246f45;text-decoration:underline;text-underline-offset:4px;font-weight:800}.task-app-link:focus-visible{outline:2px solid #246f45}body.evening-mode .task-app-link{color:#fff}.task-app-note{margin-top:3px;font-size:11px}
/* Weekend single combined task view. */
.tabs[hidden]{display:none!important}
body.evening-mode .panel .summary .actions{color:#fff}
/* Owner-only inline management, without crowding the barista's Done action. */
.task-end{display:grid;gap:5px;justify-items:end}
.task-edit-trigger{min-height:26px;padding:3px 8px;border:1px solid #cbb5a1;background:transparent;color:#715440;border-radius:8px;font-size:12px;white-space:nowrap}
.task-edit-trigger:hover{background:#eee2d6}
body.evening-mode .task-edit-trigger{background:#303030;color:#fff;border-color:#777}
#taskDialog .delete-task{margin-right:auto;background:#fff2f0;color:#ad302e;border-color:#dca29e;font-weight:700}
#taskDialog .delete-task[hidden]{display:none}
@media(max-width:600px){.task-edit-trigger{font-size:11px;padding:3px 6px}}
</style></head>
<body><main><header><div><h1>Barista Tasks</h1><div class="muted">Shared daily checklist · Kape’ Bar-Rio</div></div></header>
<section class="panel" id="board" hidden><div class="summary"><div><strong id="shopDay"></strong><div class="muted" id="selectedWorker">Shared daily checklist</div></div><button id="refresh" type="button">Refresh tasks</button></div>
<div class="tabs"><button id="morning" class="active"><span aria-hidden="true">☀️</span> Morning</button><button id="evening"><span aria-hidden="true">🌙</span> Evening</button></div>
<div class="summary"><strong id="shiftName">Morning tasks</strong><div class="actions"><span id="progressText"></span><button id="addTask" type="button" hidden>+ Add task</button></div></div><progress id="progress" max="100" value="0"></progress><div id="list"></div><p class="muted">Tasks are shared by everyone in this shift. One shared checklist. Completed tasks move to the bottom.</p>
</section>
<dialog id="taskDialog" aria-labelledby="taskDialogTitle"><form id="taskAddForm"><h2 id="taskDialogTitle">Add task</h2><label>Task description<textarea name="title" required maxlength="180" rows="3" placeholder="What should be done?"></textarea></label><fieldset><legend>Show this task in</legend><label class="task-checkbox"><input type="checkbox" name="morning"> ☀️ Morning Tasks</label><label class="task-checkbox"><input type="checkbox" name="evening"> 🌙 Evening Tasks</label></fieldset><label>Section<select name="section"><option value="general">General tasks</option><option value="inside">Inside Shop</option><option value="dining">Dining Area</option><option value="afternoon">Dining Area · 3–5 PM</option><option value="handover">Cash Handover</option><option value="closing">Closing Tasks</option></select></label><div class="time-fields"><label>Start time (optional)<input name="time" type="time"></label><label>End time (optional)<input name="end" type="time"></label></div><p id="taskAddError" role="alert"></p><div class="actions"><button type="button" id="deleteTask" class="delete-task" hidden>Delete task</button><button type="button" id="cancelTask">Cancel</button><button type="submit" class="primary" id="saveTask">Save task</button></div></form></dialog>
<p id="message" role="status"></p></main>
<script src="sync-config.js"></script><script src="sync-core.js"></script><script src="sync-ui.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
let shift='morning',all=[],shopDay='',role='',busy=false,shopOpen=false,isWeekend=false,editingTaskId=null,workerId=new URLSearchParams(location.search).get('worker')||'',workerName='';
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
const say=(message='')=>$('message').textContent=message;
function dateTime(value){return value?new Date(value).toLocaleString('en-PH',{timeZone:'Asia/Manila',hour:'numeric',minute:'2-digit'}):'';}
function show(){
 document.body.classList.toggle('evening-mode',isWeekend||shift==='evening');
 $('morning').parentElement.hidden=isWeekend;
 $('shopDay').textContent=shopOpen?'Shop day: '+shopDay:'Shop closed · checklist will reset on next opening';
 $('selectedWorker').textContent=workerName?'On duty: '+workerName:'Choose a clocked-in barista';
 for(const s of ['morning','evening']){$(s).classList.toggle('active',s===shift);$(s).setAttribute('aria-selected',s===shift);}
 $('shiftName').textContent=isWeekend?'🌗 Weekend Tasks':shift==='morning'?'Morning tasks':'Evening tasks';
 const filtered=all.filter(t=>t.active&&(isWeekend||t.shift===shift||t.shift==='both')&&(!isWeekend||t.section!=='handover'));
 const count=filtered.filter(t=>t.completed_at).length;
 $('progressText').textContent=count+'/'+filtered.length+' completed';
 $('progress').value=filtered.length?Math.round(100*count/filtered.length):0;
 $('board').classList.toggle('shop-closed',!shopOpen);
 const localNow=new Date().toLocaleString('sv-SE',{timeZone:'Asia/Manila'}).replace(' ','T');
 const labels={inside:'Inside Shop',dining:'Dining Area',afternoon:'Dining Area · 3:00–5:00 PM',handover:'Cash Handover · 5:30 PM',closing:'Closing Tasks',general:'General Tasks'};
 const groups=isWeekend?['inside','dining','afternoon','closing','general']:shift==='morning'?['inside','dining','afternoon','handover','closing','general']:['general','inside','dining','afternoon','handover','closing'];
 const pieces=[];
 const ordered=(tasks)=>tasks.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||a.id-b.id);
 const renderTask=(t)=>{
   const deadline=t.due_end||t.due_time;
   const overdue=!t.completed_at&&!!deadline&&(localNow.slice(0,10)>shopDay||(localNow.slice(0,10)===shopDay&&localNow.slice(11,16)>deadline));
   const time=t.due_time?(t.due_end?t.due_time+'–'+t.due_end:t.due_time):'Anytime';
   const inventoryUrl=location.hostname.endsWith('github.io')?'https://russelljohnramosmicumao-arch.github.io/Kapebarrio-inventory-system/':'https://kapebarrio-inventory-system.pages.dev/';
   const description=t.action_key==='inventory'?'<a class="task-app-link" href="'+inventoryUrl+'" target="_blank" rel="noopener noreferrer" title="Open Inventory App">'+escapeHtml(t.title)+' ↗</a>':escapeHtml(t.title);
   return '<div class="task '+(t.completed_at?'completed':'')+'"><button class="check '+(t.completed_at?'done':'')+'" data-task="'+t.id+'" '+(t.completed_at||busy||!shopOpen?'disabled':'')+'>'+(t.completed_at?'✓':'Done')+'</button><div><div class="task-title">'+description+'</div><div class="task-note">'+(t.completed_at?'✓ '+escapeHtml(t.completed_by||'Completed')+' · '+escapeHtml(dateTime(t.completed_at)):(!shopOpen?'Shop is closed':'Not completed'))+(t.action_key==='inventory'?'<div class="muted task-app-note">Tap Inventory to open the app. Mark Done after completing the count.</div>':'')+'</div></div><div class="task-end"><div class="time '+(overdue?'late':'')+'">'+escapeHtml(time)+(overdue?'<div>Overdue</div>':'')+'</div>'+(role==='owner'?'<button class="task-edit-trigger" data-edit-task="'+t.id+'" title="Edit or delete task" aria-label="Edit or delete '+escapeHtml(t.title)+'">✎ Edit</button>':'')+'</div></div>';
 };
 for(const group of groups){
   const tasks=ordered(filtered.filter(t=>(t.section||'general')===group&&!t.completed_at));
   if(!tasks.length)continue;
   pieces.push('<div class="task-group"><div class="group-heading"><strong>'+escapeHtml(labels[group])+'</strong><span>'+tasks.length+' remaining</span></div>'+(group==='afternoon'?'<p class="muted group-note">Share these tasks with the upcoming barista during handover.</p>':''));
   for(const t of tasks)pieces.push(renderTask(t));
   pieces.push('</div>');
 }
 const doneTasks=ordered(filtered.filter(t=>t.completed_at));
 if(doneTasks.length){
   pieces.push('<div class="task-group completed-group"><div class="group-heading"><strong>✓ Completed tasks</strong><span>'+doneTasks.length+' done</span></div>');
   for(const t of doneTasks)pieces.push(renderTask(t));
   pieces.push('</div>');
 }
 $('list').innerHTML=pieces.length?pieces.join(''):'<p class="muted">No tasks set for this shift yet.</p>';
 $('list').querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>check(Number(b.dataset.task)));
 $('list').querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>editTask(Number(b.dataset.editTask)));
}
async function snapshot(){const result=await KBRCloud.rpc('kbr_barista_tasks_snapshot',{});all=result.tasks||[];shopDay=result.shop_day;shopOpen=!!result.shop_open;isWeekend=!!result.is_weekend;show();}
async function check(id){if(busy)return;busy=true;say('Saving task…');show();try{if(!workerId)throw Error('Please choose the barista on duty first.');const result=await KBRCloud.rpc('kbr_barista_task_check_selected',{p_task:id,p_worker:workerId});if(result?.error)throw Error(result.error);await snapshot();say('Task completed and saved.');}catch(e){say(e.message);}finally{busy=false;show();}}
const dialog=$('taskDialog'),taskForm=$('taskAddForm');
function editTask(id){
 if(role!=='owner'||busy)return;
 const task=all.find(t=>t.id===id&&t.active);
 if(!task){say('Task not found. Refresh and try again.');return;}
 editingTaskId=id;
 taskForm.reset();
 taskForm.elements.title.value=task.title;
 taskForm.elements.morning.checked=task.shift==='morning'||task.shift==='both';
 taskForm.elements.evening.checked=task.shift==='evening'||task.shift==='both';
 taskForm.elements.section.value=task.section||'general';
 taskForm.elements.time.value=task.due_time||'';
 taskForm.elements.end.value=task.due_end||'';
 $('taskDialogTitle').textContent='Edit task';
 $('saveTask').textContent='Save changes';
 $('deleteTask').hidden=false;
 $('taskAddError').textContent='';
 dialog.showModal();
}

$('addTask').onclick=()=>{
 if(role!=='owner')return;
 editingTaskId=null;
 taskForm.reset();
 $('taskDialogTitle').textContent='Add task';
 $('saveTask').textContent='Save task';
 $('deleteTask').hidden=true;
 taskForm.elements.morning.checked=isWeekend||shift==='morning';
 taskForm.elements.evening.checked=isWeekend||shift==='evening';
 taskForm.elements.section.value=!isWeekend&&shift==='evening'?'general':'inside';
 $('taskAddError').textContent='';
 dialog.showModal();
};
$('cancelTask').onclick=()=>dialog.close();
$('deleteTask').onclick=async()=>{
 if(role!=='owner'||busy||editingTaskId===null)return;
 const task=all.find(t=>t.id===editingTaskId&&t.active);
 if(!task)return;
 if(!confirm('Delete "'+task.title+'" from the active task list?\n\nIt will disappear from future checklists, but any prior completion history will be preserved.'))return;
 busy=true;const remove=$('deleteTask');remove.disabled=true;$('taskAddError').textContent='';
 try{
  await KBRCloud.rpc('kbr_barista_task_manage_v2',{p_id:task.id,p_title:task.title,p_shift:task.shift,p_section:task.section,p_time:task.due_time||null,p_end:task.due_end||null,p_active:false,p_order:task.sort_order||0});
  dialog.close();editingTaskId=null;await snapshot();say('Task deleted from the checklist.');
 }catch(e){$('taskAddError').textContent=e.message||String(e);}
 finally{busy=false;remove.disabled=false;}
};
taskForm.onsubmit=async event=>{
 event.preventDefault();if(busy)return;
 const morning=taskForm.elements.morning.checked,evening=taskForm.elements.evening.checked;
 if(!morning&&!evening){$('taskAddError').textContent='Select at least one shift.';return;}
 const start=taskForm.elements.time.value||null,end=taskForm.elements.end.value||null;
 if(end&&(!start||end<=start)){$('taskAddError').textContent='End time must be later than start time.';return;}
 busy=true;const save=taskForm.querySelector('[type=submit]');save.disabled=true;$('taskAddError').textContent='';
 try{
  await KBRCloud.rpc('kbr_barista_task_manage_v2',{p_id:editingTaskId,p_title:taskForm.elements.title.value.trim(),p_shift:morning&&evening?'both':morning?'morning':'evening',p_section:taskForm.elements.section.value,p_time:start,p_end:end,p_active:true,p_order:editingTaskId?(all.find(t=>t.id===editingTaskId)?.sort_order||0):all.length*10+10});
  const edited=editingTaskId!==null;
  dialog.close();editingTaskId=null;await snapshot();say(edited?'Task updated successfully.':'Task added successfully.');
 }catch(e){$('taskAddError').textContent=e.message||String(e);}
 finally{busy=false;save.disabled=false;}
};
for(const s of ['morning','evening'])$(s).onclick=()=>{if(isWeekend)return;shift=s;show();};
$('refresh').onclick=async()=>{try{await snapshot();say('Tasks refreshed.');}catch(e){say(e.message);}};
async function init(){if(!KBRCloud.requireLogin())return;try{role=await KBRCloud.role();if(role!=='owner'&&role!=='operator')throw Error('Staff login required.');const roster=await KBRCloud.rpc('kbr_barista_task_roster',{});const worker=(roster||[]).find(w=>w.id===workerId);if(worker){workerName=worker.name;}else{workerId='';workerName='';const picker=document.createElement('div');picker.className='inline-worker-picker';picker.innerHTML='<h2>Who is on duty?</h2><p>Select a barista currently clocked in.</p>';const choices=document.createElement('div');choices.className='worker-choices';for(const w of roster||[]){const b=document.createElement('button');b.textContent=w.name;b.onclick=()=>{const url=new URL(location.href);url.searchParams.set('worker',w.id);location.assign(url.href);};choices.append(b);}if(!roster?.length){const msg=document.createElement('p');msg.textContent='No baristas are clocked in. Please clock in first.';picker.append(msg);}picker.append(choices);$('board').before(picker);$('board').hidden=true;}if(worker)$('board').hidden=false;if(role==='owner')$('addTask').hidden=false;await snapshot();say('');}catch(e){say(e.message);}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&role)snapshot().catch(e=>say(e.message));});
window.addEventListener('focus',()=>{if(role)snapshot().catch(e=>say(e.message));});
init();
})();
</script><script src="page-tools.js"></script></body></html>
