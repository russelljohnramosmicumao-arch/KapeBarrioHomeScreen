<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183e35"><title>Kape’ Bar-Rio | Home</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#183e35;background:#f6f3eb}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:40px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:38px}.brand{font-size:14px;font-weight:800;letter-spacing:3px;text-transform:uppercase}h1{font-size:clamp(32px,5vw,52px);margin:12px 0}p{color:#66756c;line-height:1.5}.clock{text-align:right;white-space:nowrap}.clock strong{display:block;font-size:27px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.tile{appearance:none;text-align:left;background:#fffdf8;color:#183e35;border:1px solid #dedfd2;border-radius:22px;padding:26px;min-height:190px;cursor:pointer;font:inherit;transition:transform .15s,box-shadow .15s}.tile:hover{transform:translateY(-3px);box-shadow:0 12px 28px #183e3512}.tile:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #bb8437;outline-offset:4px}.tile.primary{background:#183e35;color:white}.icon{font-size:30px;display:block;margin-bottom:20px}.tile strong{display:block;font-size:21px}.tile span.desc{display:block;margin-top:8px;color:#66756c;font-size:14px}.primary span.desc{color:#c4d8ca}.tile.manager{grid-column:span 2;background:#ebe7d8}footer{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:28px;font-size:13px;color:#66756c}.settings,.save,.cancel{font:inherit;border-radius:12px;border:1px solid #d3d8cc;padding:12px 18px;cursor:pointer;background:#fffdf8;color:#183e35}.save{background:#183e35;color:white}dialog{border:0;border-radius:22px;padding:28px;width:min(580px,calc(100% - 32px));max-height:90vh;box-shadow:0 20px 90px #0003}dialog::backdrop{background:#10291fcc}dialog h2{margin-top:0;color:#183e35}label{display:block;margin-top:14px;font-size:14px;color:#183e35;font-weight:600}input{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #cbd1c4;border-radius:9px;font:inherit}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}#notice{color:#994a23;min-height:22px}@media(max-width:760px){main{padding:28px 20px}.grid{grid-template-columns:repeat(2,1fr)}.tile{min-height:175px;padding:22px}.tile.manager{grid-column:span 2}.clock{display:none}}@media(max-width:420px){.grid{grid-template-columns:1fr}.tile.manager{grid-column:auto}.tile{min-height:155px}footer{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main>
<header><div><div class="brand">Kape’ Bar-Rio</div><h1>Welcome to your workspace.</h1><p>Everything you need for a smooth day at the café.</p></div><div class="clock"><strong id="time"></strong><span id="date"></span></div></header>
<div class="grid" id="apps"></div>
<p id="notice" role="status" aria-live="polite"></p>
<footer><span>Kape’ Bar-Rio · Staff home</span><button class="settings" id="configure">Set app links</button></footer>
</main>
<dialog id="settings"><form id="linksForm"><h2>Connect your apps</h2><p>Enter the full page address for each button. These settings are saved on this browser. Changes here apply only to this browser.</p><div id="fields"></div><p id="error" role="alert"></p><div class="actions"><button type="button" class="cancel" id="restoreDefaults">Restore links</button><button type="button" class="cancel" id="cancel">Cancel</button><button type="submit" class="save">Save links</button></div></form></dialog>
<script>
// Set the exact published URLs here before uploading to GitHub Pages.
// Recipe and Costing may use separate routes in the same app.
const DEFAULT_LINKS={"ordering": "https://russelljohnramosmicumao-arch.github.io/Kape-Barrio/", "inventory": "https://russelljohnramosmicumao-arch.github.io/Kapebarrio-inventory-system/", "recipe": "https://russelljohnramosmicumao-arch.github.io/recipe-and-costing/recipe.html", "costing": "https://russelljohnramosmicumao-arch.github.io/recipe-and-costing/costing.html", "attendance": "https://russelljohnramosmicumao-arch.github.io/KapeBarrioHomeScreen/clock-in.html", "shift": "https://russelljohnramosmicumao-arch.github.io/KapeBarrioHomeScreen/open-end-shift.html", "manager": "https://russelljohnramosmicumao-arch.github.io/ManagersPage/"};
const APPS=[['ordering','Ordering app','Take orders and process payments','☕'],['inventory','Inventory','View ingredients and packaging','📦'],['recipe','Recipe','Find drinks and preparation steps','📖'],['costing','Costing','Review costs, prices and margins','🧮'],['attendance','Clock in / Clock out','Record your working hours','⏱'],['shift','Open / End shift','Start or finish your shop shift','🔑'],['manager',"Manager’s page",'Open your management tools','⚙']];
const KEY='kape-barrio-home-links-v3';let links={...DEFAULT_LINKS};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');for(const [id] of APPS){if(typeof saved[id]==='string'&&validLink(saved[id]))links[id]=saved[id]}}catch{}
function validLink(value){try{const url=new URL(value);return ['https:','http:'].includes(url.protocol)&&!url.username&&!url.password}catch{return false}}
for(const [id,title,desc,icon] of APPS){const button=document.createElement('button');button.type='button';button.className='tile'+(id==='ordering'?' primary':'')+(id==='manager'?' manager':'');const glyph=document.createElement('span');glyph.className='icon';glyph.textContent=icon;glyph.setAttribute('aria-hidden','true');const heading=document.createElement('strong');heading.textContent=title;const detail=document.createElement('span');detail.className='desc';detail.textContent=desc;button.append(glyph,heading,detail);button.addEventListener('click',()=>{if(validLink(links[id]))location.assign(links[id]);else document.getElementById('notice').textContent='Set the page link for '+title+' to connect this button.'});document.getElementById('apps').append(button);const label=document.createElement('label');label.textContent=title;const input=document.createElement('input');input.type='url';input.name=id;input.placeholder='https://your-account.github.io/your-app/';label.append(input);document.getElementById('fields').append(label)}
const dialog=document.getElementById('settings'),form=document.getElementById('linksForm');document.getElementById('configure').onclick=()=>{for(const [id]of APPS)form.elements[id].value=links[id];document.getElementById('error').textContent='';dialog.showModal()};document.getElementById('cancel').onclick=()=>dialog.close();document.getElementById('restoreDefaults').onclick=()=>{for(const [id]of APPS)form.elements[id].value=DEFAULT_LINKS[id];document.getElementById('error').textContent='Default links restored. Press Save links to apply.';};form.onsubmit=event=>{event.preventDefault();const next={};for(const [id,title]of APPS){const value=form.elements[id].value.trim();if(value&&!validLink(value)){document.getElementById('error').textContent='Enter a valid HTTP or HTTPS address for '+title+'.';return}next[id]=value||DEFAULT_LINKS[id]}try{localStorage.setItem(KEY,JSON.stringify(next));links=next;dialog.close();document.getElementById('notice').textContent='App links saved.'}catch{document.getElementById('error').textContent='This browser could not save your links. Please allow browser storage and try again.'}};
function tick(){const now=new Date();document.getElementById('time').textContent=now.toLocaleTimeString('en-PH',{timeZone:'Asia/Manila',hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=now.toLocaleDateString('en-PH',{timeZone:'Asia/Manila',weekday:'short',month:'short',day:'numeric'})}tick();setInterval(tick,1000);
</script></body></html>
