<body><main>
<header><div><div class="brand">Kape’ Bar-Rio</div></div></header>
<div class="grid" id="apps"></div>
<p id="notice" role="status" aria-live="polite"></p>
<footer><span>Kape’ Bar-Rio · Staff home</span><button class="settings" id="configure">Set app links</button></footer>
</main>
<dialog id="settings"><form id="linksForm"><h2>Connect your apps</h2><p>Enter the full page address for each button. These settings are saved on this browser. Changes here apply only to this browser.</p><div id="fields"></div><p id="error" role="alert"></p><div class="actions"><button type="button" class="cancel" id="restoreDefaults">Restore links</button><button type="button" class="cancel" id="cancel">Cancel</button><button type="submit" class="save">Save links</button></div></form></dialog>
<script>
// Set the exact published URLs here before uploading to GitHub Pages.
// Recipe and Costing share one workspace.
const DEFAULT_LINKS={"ordering": "https://russelljohnramosmicumao-arch.github.io/Kape-Barrio/", "inventory": "https://russelljohnramosmicumao-arch.github.io/Kapebarrio-inventory-system/", "recipe": "https://russelljohnramosmicumao-arch.github.io/recipe-and-costing/", "attendance": "https://russelljohnramosmicumao-arch.github.io/KapeBarrioHomeScreen/clock-in.html", "shift": "https://russelljohnramosmicumao-arch.github.io/KapeBarrioHomeScreen/open-end-shift.html", "manager": "https://russelljohnramosmicumao-arch.github.io/ManagersPage/"};
const APPS=[["ordering", "Ordering", "Take orders", "<path d=\"M6 5h12v13a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3ZM18 8h2a3 3 0 0 1 0 6h-2M9 2v1M13 2v1M3 22h18\"/>"], ["attendance", "Clock In / Out", "Your working hours", "<circle cx=\"12\" cy=\"13\" r=\"9\"/><path d=\"M12 8v5l3 2M9 1h6M12 1v3\"/>"], ["shift", "Open / End Shift", "Shop and cash register", "<path d=\"M4 21V9h16v12M3 9l2-6h14l2 6M8 21v-7h8v7M2 21h20M3 9a3 3 0 0 0 4 0 3 3 0 0 0 5 0 3 3 0 0 0 5 0 3 3 0 0 0 4 0\"/>"], ["inventory", "Inventory", "Count and track stock", "<path d=\"m3 7 9-5 9 5v11l-9 5-9-5ZM3 7l9 5 9-5M12 12v11M7 4.8l9 5\"/>"], ["manager", "Manager", "People, inventory and sales", "<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M5 22v-3a7 7 0 0 1 14 0v3M9 15l3 4 3-4\"/>"], ["recipe", "Recipe & Costing", "Recipes, prices and margins", "<path d=\"M12 5C8 2 4 3 2 4v15c3-1 6-1 10 2 4-3 7-3 10-2V4c-2-1-6-2-10 1ZM12 5v16M5 8h4M5 12h4M16 8h3M16 12h3\"/>"]];
const KEY='kape-barrio-home-links-v4';let links={...DEFAULT_LINKS};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');for(const [id] of APPS){if(typeof saved[id]==='string'&&validLink(saved[id]))links[id]=saved[id]}}catch{}
function validLink(value){try{const url=new URL(value);return ['https:','http:'].includes(url.protocol)&&!url.username&&!url.password}catch{return false}}
for(const [id,title,desc,icon] of APPS){const button=document.createElement('button');button.type='button';button.className='tile tile-'+id;const glyph=document.createElement('span');glyph.className='icon';glyph.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">'+icon+'</svg>';glyph.setAttribute('aria-hidden','true');const heading=document.createElement('strong');heading.textContent=title;const detail=document.createElement('span');detail.className='desc';detail.textContent=desc;button.append(glyph,heading,detail);if(id==='attendance'){const clock=document.createElement('div');clock.className='tile-clock';clock.innerHTML='<time data-clock-time></time><span data-clock-date></span>';button.append(clock);}button.addEventListener('click',()=>{if(validLink(links[id]))location.assign(links[id]);else document.getElementById('notice').textContent='Set the page link for '+title+' to connect this button.'});document.getElementById('apps').append(button);const label=document.createElement('label');label.textContent=title;const input=document.createElement('input');input.type='url';input.name=id;input.placeholder='https://your-account.github.io/your-app/';label.append(input);document.getElementById('fields').append(label)}
const dialog=document.getElementById('settings'),form=document.getElementById('linksForm');document.getElementById('configure').onclick=()=>{for(const [id]of APPS)form.elements[id].value=links[id];document.getElementById('error').textContent='';dialog.showModal()};document.getElementById('cancel').onclick=()=>dialog.close();document.getElementById('restoreDefaults').onclick=()=>{for(const [id]of APPS)form.elements[id].value=DEFAULT_LINKS[id];document.getElementById('error').textContent='Default links restored. Press Save links to apply.';};form.onsubmit=event=>{event.preventDefault();const next={};for(const [id,title]of APPS){const value=form.elements[id].value.trim();if(value&&!validLink(value)){document.getElementById('error').textContent='Enter a valid HTTP or HTTPS address for '+title+'.';return}next[id]=value||DEFAULT_LINKS[id]}try{localStorage.setItem(KEY,JSON.stringify(next));links=next;dialog.close();document.getElementById('notice').textContent='App links saved.'}catch{document.getElementById('error').textContent='This browser could not save your links. Please allow browser storage and try again.'}};

</script><script src="page-tools.js"></script><script src="page-clock.js"></script></body></html>
