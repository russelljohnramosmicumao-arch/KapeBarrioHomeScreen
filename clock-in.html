/* Personalized barista profile on Clock In / Clock Out. */
.clock-worker-profile{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}

@media(max-width:500px){.clock-profile-photo{width:126px;height:126px;font-size:34px}.clock-photo-picker{width:75px;height:75px;font-size:25px}}

/* Two-step attendance login: visual worker gallery, then private numeric PIN. */
.clock-worker-selection{max-width:1050px;margin:20px auto;padding:8px 0 24px;text-align:center}
.clock-worker-selection h2{margin:8px 0;font-size:clamp(24px,4vw,35px);color:#503827}
